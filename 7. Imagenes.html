<!-- Indica que es documento HTML -->
<!DOCTYPE html>
<!--El lenguaje de la pagina -->
<html lang="en">
<!-- Abre el encabezado -->
<head>
    <!--Habilita caracteres especiales -->
    <meta charset="UTF-8">
    <!--Ajusta el ancho de la pagina en cada dispositivo  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Titulo de la pestaña -->
    <title>Imagenes en HTML</title>
<!--Cierra el encabezado -->
</head>
<!--Abre el cuerpo de la pagina -->
<body>
    <!--Subtitulo de la pagina -->
    <h2>Imagenes en HTML</h2>
    <!--titulo poco menos importante que h2 -->
    <h3>Locales</h3>
    <!--img indica que se inserta imagen , src especifica la ruta , alt describe que hay en la imagen -->
    <img src="caritas.png" alt="Imagen de carita feliz">
    <!--titulo poco menos importante que h2 -->
    <h3>Locales redismensionado</h3>
    <!--indica que la imagen esta en el archivo de imagenes , alt describe que hay en la imagen , width es el ancho y height es la altura-->
    <img src="imagenes/carita.png" alt="" width="200" height="100">
    <h3>Desde internet</h3>
    <!--inserta la url de la imagen , alt describe que hay en la imagen , width es el ancho y height es la altura-->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="">
    <!--titulo poco menos importante que h2 -->
    <h3>Animaciones</h3>
    <!--inserta la url de un gif , alt describe que hay en el gif , width es el ancho y height es la altura-->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
<!--cierra el cuerpo de la pagina -->
</body>
<!--cierra el documento HTML -->
</html>
