<!--Indica que es Documento HTML -->
<!DOCTYPE html>
<!--Lenguaje de la pagina -->
<html lang="en">

<!--Abre el encabezado -->
<head>
    <!--Habilita caracteres especiales -->
    <meta charset="UTF-8">
    <!--Ajusta la pagina en cada dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Titulo de la pestaña -->
    <title>Salto de linea en HTML</title>
<!--Cierra el encabezado -->
</head>

<!--Abre el cuerpo de la pagina -->
<body>
    <!--Titulo de la pagina -->
    <h1>Lenguaje de programacion</h1>
    <!--Parrafo con salto de linea -->
    <p>En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br><!--Salto de linea -->
        Dart<br><!--Salto de linea -->
        Flutter<br><!--Salto de linea -->
        Python<br><!--Salto de linea -->
        Ruby<br><!--Salto de linea -->
        Java<br><!--Salto de linea -->
        TypeScript<br><!--Salto de linea -->
        Entre otros.
    <!--Cierra el parrafo con salto de linea-->
    </p>
<!--Cierra el cuerpo de la pagina -->
</body>

<!--Cierra el documento HTML -->
</html>
